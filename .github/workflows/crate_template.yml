name: Crate Template
run-name: Testing out the contents of the 'crate_template' directory.

# Scheduled to run whenever a push happens and at midnight on every Sunday. The
# former is for changes we introduce, the latter is for changes to the
# environment that we don't have control over (e.g., a new edition of Rust
# breaks the template).
on:
  push:
    branches:
      - '**' # Always runs whenever a push happens
  schedule:
    - cron: '0 0 * * 0' # Runs this every Sunday at midnight EST.
      timezone: "America/New_York"

jobs:
  ubuntu_tests:
    name: "Ubuntu-latest for binary and library crates"
    runs-on: ubuntu-latest
    steps:
      - name: "Installing stable, beta, and nightly Rust toolchains"
        shell: bash
        run: |
          # I'm uninstalling any Rust toolchains that are currently installed to
          # ensure that the only toolchains are the latest ones.  If rustup
          # isn't currently installed, then this *shouldn't* cause any issues as
          # the return code will be overwritten by the next command.
          toolchains=$( rustup toolchain list -q )
          for thing in $toolchains
          do
            rustup toolchain uninstall thing
          done

          # Install rust tooling and make sure they're in the path
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          . "$HOME/.cargo/env"

          rustup toolchain install stable beta nightly
          rustup update

      - name: "Installing various cargo support tools"
        shell: bash
        run: |
          # There seems to be some kind of issue with cargo-make where it isn't
          # installing the necessary tooling on it's own.  As a workaround, I'm
          # manually installing everything that's needed.
          cargo install cargo-auditable
          cargo install cargo-deadlinks
          cargo install cargo-deny
          cargo install cargo-generate
          cargo install cargo-llvm-cov
          cargo install cargo-make
          cargo install cargo-readme
          cargo install cargo-udeps
          cargo install cargo-update
          cargo install mdbook
          cargo install taplo-cli

          # I have to do this a second time to ensure that the tools are
          # properly picked up.
          . "$HOME/.cargo/env"

          # This ensures that if the image already has some cargo tools
          # installed that they are updated to the latest versions.
          cargo install-update -a

      - name: 'Testing binary crate build'
        shell: bash
        run: |
          # I'm deleting whatever is in the working directory as we don't want
          # or need it.  We're going to generate it from scratch using
          # 'cargo generate'
          rm -rf *
          rm -rf .* # Some shells don't delete hidden files unless you tell them to like this.

          # Ladies and gentlemen, the moment you've all been waiting for!
          cargo generate --name "binary_crate" \
            --bin \
            -g https://github.com/cfkaran2/cargo_generate_templates.git \
            -d rust_edition="2024" \
            -d short_description="A binary crate" \
            -d long_description="A crate generated using the 'cargo generate' command." \
            -d version="0.0.1" \
            -d identifier="com.fake.binary_crate_test" \
            -d abuse_email="abuse@fake.com" \
            -d user_guide_title="Binary User Guide"

          # Now to test that it worked.  We don't really care about the output
          # of the following commands, just that they don't fail.

          pushd binary_crate

          cargo make
          cargo make dev-flow
          cargo make optimized-flow
          cargo make clean
          cargo make help

          popd

      - name: 'Testing library crate build'
        shell: bash
        run: |
          cargo generate --name "library_crate" \
            --bin \
            -g https://github.com/cfkaran2/cargo_generate_templates.git \
            -d rust_edition="2024" \
            -d short_description="A library crate" \
            -d long_description="A crate generated using the 'cargo generate' command." \
            -d version="0.0.1" \
            -d identifier="com.fake.library_crate_test" \
            -d abuse_email="abuse@fake.com" \
            -d user_guide_title="Library User Guide"

          pushd library_crate

          cargo make
          cargo make dev-flow
          cargo make optimized-flow
          cargo make clean
          cargo make help

          popd


